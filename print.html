<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light only">
<title>じぶんのQRカードを印刷 — お互い様プロジェクト</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;700&family=Zen+Kaku+Gothic+New:wght@300;400;500&family=Noto+Serif+JP:wght@300;400;700&display=swap');

  :root {
    --ink: #1a1208;
    --paper: #f5f0e8;
    --cream: #faf6ee;
    --gold: #b8860b;
    --gray: #6b6355;
    --border: #c8b99a;
    --red: #8b1a1a;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }

  /* ============================================================
     画面UI
  ============================================================ */
  body {
    background: var(--paper);
    font-family: 'Noto Serif JP', serif;
    color: var(--ink);
  }
  .screen-ui {
    max-width: 720px;
    margin: 0 auto;
    padding: 36px 20px 80px;
  }
  .page-header { text-align: center; margin-bottom: 28px; }
  .page-en {
    font-family: 'Zen Kaku Gothic New', sans-serif;
    font-size: 9px; letter-spacing: 5px; color: var(--gold);
    text-transform: uppercase; margin-bottom: 8px;
  }
  .page-title {
    font-family: 'Shippori Mincho', serif;
    font-size: 22px; font-weight: 700; letter-spacing: 6px;
  }
  .gold-line {
    height: 1px; background: linear-gradient(90deg, transparent, var(--border), transparent);
    margin: 22px 0;
  }
  .intro {
    font-size: 13px; line-height: 2; color: var(--gray);
    text-align: center; margin-bottom: 26px;
  }
  .back-link {
    display: inline-block; margin-bottom: 18px;
    font-family: 'Zen Kaku Gothic New', sans-serif;
    font-size: 12px; color: var(--gray); text-decoration: none; letter-spacing: 1px;
  }
  .back-link:hover { color: var(--ink); }

  /* 発行ボタン */
  .btn-issue {
    display: block; width: 100%;
    padding: 16px; margin-bottom: 12px;
    background: var(--ink); color: var(--cream);
    border: 1px solid var(--ink); border-radius: 10px;
    font-family: 'Shippori Mincho', serif;
    font-size: 15px; letter-spacing: 4px; cursor: pointer;
    transition: background .2s, border-color .2s;
  }
  .btn-issue:hover { background: var(--gold); border-color: var(--gold); }
  .btn-issue:disabled { opacity: .5; cursor: default; }
  .issue-note {
    font-family: 'Zen Kaku Gothic New', sans-serif;
    font-size: 11px; color: var(--gray); text-align: center;
    line-height: 1.9; margin-bottom: 26px;
  }
  .msg-inline {
    text-align: center; font-size: 13px; line-height: 1.9;
    color: var(--red); margin: 10px 0 20px; display: none;
  }

  /* シート（束）一覧 */
  .sheet-list-label {
    font-family: 'Zen Kaku Gothic New', sans-serif;
    font-size: 10px; letter-spacing: 3px; color: var(--gold);
    margin-bottom: 12px;
  }
  .sheet-item {
    display: flex; align-items: center; gap: 14px;
    background: var(--cream); border: 1px solid var(--border);
    border-radius: 10px; padding: 14px 16px; margin-bottom: 10px;
  }
  .sheet-lot {
    font-family: 'Shippori Mincho', serif;
    font-size: 16px; font-weight: 700; letter-spacing: 1px;
    min-width: 72px;
  }
  .sheet-meta {
    flex: 1;
    font-family: 'Zen Kaku Gothic New', sans-serif;
    font-size: 11px; color: var(--gray); line-height: 1.7;
  }
  .sheet-meta .expired { color: var(--red); }
  .btn-open {
    padding: 9px 16px; background: transparent;
    border: 1px solid var(--border); border-radius: 8px;
    color: var(--ink); font-family: 'Zen Kaku Gothic New', sans-serif;
    font-size: 12px; letter-spacing: 1px; cursor: pointer; white-space: nowrap;
  }
  .btn-open:hover { border-color: var(--gold); color: var(--gold); }
  .empty-state {
    text-align: center; padding: 36px 0; color: var(--gray);
    font-size: 13px; line-height: 2;
  }
  .loading-state { text-align: center; padding: 60px 0; color: var(--gray); font-size: 13px; }

  /* プレビュー画面 */
  .preview-head { text-align: center; margin-bottom: 16px; }
  .preview-lot {
    font-family: 'Shippori Mincho', serif;
    font-size: 18px; font-weight: 700; letter-spacing: 2px;
  }
  .preview-sub {
    font-family: 'Zen Kaku Gothic New', sans-serif;
    font-size: 11px; color: var(--gray); margin-top: 6px; line-height: 1.8;
  }
  .btn-print {
    display: block; width: 100%; max-width: 420px; margin: 18px auto 8px;
    padding: 16px; background: var(--ink); color: var(--cream);
    border: 1px solid var(--ink); border-radius: 10px;
    font-family: 'Shippori Mincho', serif;
    font-size: 15px; letter-spacing: 4px; cursor: pointer;
  }
  .btn-print:hover { background: var(--gold); border-color: var(--gold); }
  .print-tips {
    max-width: 420px; margin: 0 auto 24px;
    font-family: 'Zen Kaku Gothic New', sans-serif;
    font-size: 11px; color: var(--gray); line-height: 2;
  }

  /* 画面上のシート縮小表示 */
  .sheet-scale-wrap {
    width: 100%; overflow: hidden;
    display: flex; justify-content: center;
    background: #e8e0d0; border: 1px solid var(--border);
    border-radius: 10px; padding: 16px 0;
  }
  .sheet-scale { transform-origin: top center; }

  .hidden { display: none !important; }

  /* ============================================================
     A4シート（印刷実体）— 210×297mm / 91×55mm × 2列5行
  ============================================================ */
  .print-sheet {
    width: 210mm; height: 297mm;
    background: #fff;
    padding: 11mm 14mm;
    display: grid;
    grid-template-columns: 91mm 91mm;
    grid-template-rows: repeat(5, 55mm);
  }
  .cut-cell {
    width: 91mm; height: 55mm;
    border-right: 0.15mm dashed #c9c2b4;
    border-bottom: 0.15mm dashed #c9c2b4;
    position: relative;
  }
  .cut-cell:nth-child(odd) { border-left: 0.15mm dashed #c9c2b4; }
  .cut-cell:nth-child(-n+2) { border-top: 0.15mm dashed #c9c2b4; }

  /* ---- カード面 ---- */
  .card-face {
    position: absolute; inset: 0;
    background: var(--cream);
    padding: 4.5mm 5mm;
    display: flex; gap: 4mm;
  }
  .cf-frame {
    position: absolute; inset: 2.2mm;
    border: 0.25mm solid var(--border);
    pointer-events: none;
  }
  .cf-left {
    flex: 1; display: flex; flex-direction: column;
    min-width: 0; padding-top: 0.8mm;
  }
  .cf-eyebrow {
    font-family: 'Zen Kaku Gothic New', sans-serif;
    font-size: 5.4pt; letter-spacing: 1.6pt; color: var(--gold);
  }
  .cf-project {
    font-family: 'Shippori Mincho', serif;
    font-size: 7pt; letter-spacing: 2.5pt; color: var(--ink);
    margin-top: 1mm;
  }
  .cf-display {
    font-family: 'Shippori Mincho', serif;
    font-size: 17pt; font-weight: 700; letter-spacing: 5pt;
    color: var(--ink); margin-top: 4mm;
  }
  .cf-display .cf-dot { color: var(--red); }
  .cf-message {
    font-family: 'Noto Serif JP', serif;
    font-size: 6.4pt; line-height: 1.9; color: var(--gray);
    margin-top: 2.6mm;
  }
  .cf-tagline {
    margin-top: auto;
    font-family: 'Zen Kaku Gothic New', sans-serif;
    font-size: 5.2pt; letter-spacing: 1.4pt; color: var(--gold);
  }
  .cf-right {
    width: 22mm; flex-shrink: 0;
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 1.4mm;
  }
  .cf-qr {
    width: 21mm; height: 21mm;
    background: #fff; padding: 1mm;
  }
  .cf-qr svg { width: 19mm; height: 19mm; display: block; }
  .cf-shortid {
    font-family: 'Courier New', monospace;
    font-size: 7pt; letter-spacing: 1.2pt; color: var(--ink); font-weight: 700;
  }
  .cf-lotno {
    font-family: 'Zen Kaku Gothic New', sans-serif;
    font-size: 4.8pt; letter-spacing: 0.6pt; color: var(--gold);
  }

  /* ============================================================
     印刷時：UIを全部消してシートだけ原寸で出す
  ============================================================ */
  @page { size: A4 portrait; margin: 0; }
  @media print {
    body { background: #fff; }
    .screen-ui { display: none !important; }
    #print-layer { display: block !important; }
    .print-sheet {
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }
  }
  #print-layer { display: none; }
</style>
</head>
<body>

<!-- ===== 画面UI ===== -->
<div class="screen-ui">
  <a class="back-link" href="mypage.html">← マイページへもどる</a>

  <div class="page-header">
    <div class="page-en">Print Your Cards</div>
    <div class="page-title">じぶんのQRカード</div>
  </div>

  <div class="loading-state" id="loading">読み込み中…</div>

  <!-- 一覧ビュー -->
  <div id="list-view" class="hidden">
    <div class="intro">
      A4用紙1枚に、あなた専用のQRカードが10枚。<br>
      おうちのプリンターやコンビニで印刷して、<br>
      はさみで切って、感謝を手渡せます。
    </div>

    <button class="btn-issue" id="btn-issue" onclick="issueSheet()">あたらしい10枚をつくる</button>
    <div class="issue-note">
      カードの使用期限は、つくった日から2ヶ月です。<br>
      未使用のカードが9枚以下になると、次の10枚がつくれます。
    </div>
    <div class="msg-inline" id="issue-msg"></div>

    <div class="gold-line"></div>

    <div class="sheet-list-label">あ な た の シ ー ト</div>
    <div id="sheet-list"></div>
  </div>

  <!-- プレビュービュー -->
  <div id="preview-view" class="hidden">
    <div class="preview-head">
      <div class="preview-lot" id="preview-lot">—</div>
      <div class="preview-sub" id="preview-sub"></div>
    </div>

    <div class="sheet-scale-wrap" id="scale-wrap">
      <div class="sheet-scale" id="sheet-scale"></div>
    </div>

    <button class="btn-print" onclick="window.print()">こ の 10 枚 を 印 刷 す る</button>
    <div class="print-tips">
      ・A4・カラー印刷がおすすめです（白黒でもQRは読み取れます）<br>
      ・印刷設定は「倍率100%（実際のサイズ）」「余白なし or 最小」を選んでください<br>
      ・コンビニで刷る場合は、印刷画面で「PDFに保存」してからマルチコピー機へ
    </div>
    <button class="btn-open" style="display:block;margin:0 auto;" onclick="showList()">← シート一覧へもどる</button>
  </div>
</div>

<!-- ===== 印刷実体（プレビューと同じDOMを原寸で持つ） ===== -->
<div id="print-layer"></div>

<script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

  const SUPABASE_URL = 'https://damussuizcfzqkfkpwwm.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRhbXVzc3VpemNmenFrZmtwd3dtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU0NTcwOTIsImV4cCI6MjA5MTAzMzA5Mn0.Xp93BfRowa9gG7ZMRQxyyKiYXgWRN4Gk5xLxaGTiUIo';
  const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const RECEIVE_BASE = 'https://otagaisama.github.io/otagaisama/receive.html?room=';
  const EXPIRE_MONTHS = 2;

  let currentUser = null;
  let myRooms = [];   // 自分のH束カード全部
  let lots = [];      // [{lot, rooms:[...], createdAt, expiresAt, unused}]

  window.onload = async () => {
    const { data: { session } } = await db.auth.getSession();
    if (!session) { location.replace('index.html'); return; }
    currentUser = session.user;
    await loadSheets();
  };

  async function loadSheets() {
    const { data, error } = await db
      .from('rooms').select('*')
      .eq('user_id', currentUser.id)
      .like('lot_no', 'H%')
      .order('lot_no', { ascending: true });
    if (error) { console.error(error); }
    myRooms = data || [];

    // lot単位にまとめる
    const map = new Map();
    for (const r of myRooms) {
      const lot = (r.lot_no || '').split('-')[0];
      if (!lot) continue;
      if (!map.has(lot)) map.set(lot, []);
      map.get(lot).push(r);
    }
    lots = [...map.entries()].map(([lot, rooms]) => {
      const createdAt = rooms.reduce((a, r) => (!a || r.created_at < a) ? r.created_at : a, null);
      const expiresAt = createdAt ? new Date(new Date(createdAt).getTime() + EXPIRE_MONTHS * 30.5 * 86400000) : null;
      const unused = rooms.filter(r => !r.is_confirmed && !r.closed_at).length;
      return { lot, rooms, createdAt, expiresAt, unused };
    }).sort((a, b) => b.lot.localeCompare(a.lot));

    renderList();
    showList();
  }

  function fmtDate(d) {
    if (!d) return '—';
    const dt = (d instanceof Date) ? d : new Date(d);
    return `${dt.getFullYear()}年${dt.getMonth()+1}月${dt.getDate()}日`;
  }

  function renderList() {
    const el = document.getElementById('sheet-list');
    if (lots.length === 0) {
      el.innerHTML = `<div class="empty-state">まだシートがありません。<br>「あたらしい10枚をつくる」から始めましょう。</div>`;
      return;
    }
    el.innerHTML = lots.map((l, i) => {
      const expired = l.expiresAt && l.expiresAt < new Date();
      return `
      <div class="sheet-item">
        <div class="sheet-lot">${l.lot}</div>
        <div class="sheet-meta">
          作成 ${fmtDate(l.createdAt)} ／ 期限 <span class="${expired ? 'expired' : ''}">${fmtDate(l.expiresAt)}${expired ? '（期限切れ）' : ''}</span><br>
          未使用 ${l.unused} / ${l.rooms.length} 枚
        </div>
        <button class="btn-open" onclick="openSheet(${i})">表示・印刷</button>
      </div>`;
    }).join('');
  }

  function showList() {
    document.getElementById('loading').classList.add('hidden');
    document.getElementById('preview-view').classList.add('hidden');
    document.getElementById('list-view').classList.remove('hidden');
    document.getElementById('print-layer').innerHTML = '';
  }
  window.showList = showList;

  // ===== 新しい10枚を発行 =====
  window.issueSheet = async function() {
    const btn = document.getElementById('btn-issue');
    const msg = document.getElementById('issue-msg');
    msg.style.display = 'none';
    btn.disabled = true;
    btn.textContent = 'つくっています…';
    try {
      const { data, error } = await db.rpc('create_my_bundle');
      if (error) throw error;
      if (!data.ok) {
        msg.textContent = {
          stock_remaining: `未使用のカードがまだ ${data.stock} 枚あります。9枚以下になると、次の10枚がつくれます。`,
          not_logged_in: 'ログインが必要です。'
        }[data.error] || 'エラーが発生しました。';
        msg.style.display = 'block';
        return;
      }
      await loadSheets();
      const idx = lots.findIndex(l => l.lot === data.lot_id);
      if (idx >= 0) openSheet(idx);
    } catch (e) {
      console.error(e);
      msg.textContent = 'エラーが発生しました。時間をおいて再度お試しください。';
      msg.style.display = 'block';
    } finally {
      btn.disabled = false;
      btn.textContent = 'あたらしい10枚をつくる';
    }
  };

  // ===== シート表示 =====
  window.openSheet = function(i) {
    const l = lots[i];
    if (!l) return;

    document.getElementById('list-view').classList.add('hidden');
    document.getElementById('preview-view').classList.remove('hidden');
    document.getElementById('preview-lot').textContent = `シート ${l.lot}`;
    document.getElementById('preview-sub').innerHTML =
      `作成 ${fmtDate(l.createdAt)} ／ 期限 ${fmtDate(l.expiresAt)} ／ ${l.rooms.length}枚`;

    // 印刷実体を組む
    const layer = document.getElementById('print-layer');
    layer.innerHTML = '';
    layer.appendChild(buildSheet(l));

    // 画面プレビュー＝クローンではなく実体をもう1組生成（canvasはクローンに写らないため）
    const scaleHost = document.getElementById('sheet-scale');
    scaleHost.innerHTML = '';
    const previewSheet = buildSheet(l);
    scaleHost.appendChild(previewSheet);
    requestAnimationFrame(() => {
      const wrapW = document.getElementById('scale-wrap').clientWidth - 8;
      const sheetW = previewSheet.offsetWidth || 794; // 210mm ≒ 794px
      const s = Math.min(1, wrapW / sheetW);
      scaleHost.style.transform = `scale(${s})`;
      scaleHost.style.height = `${(previewSheet.offsetHeight || 1123) * s}px`;
    });

    window.scrollTo(0, 0);
  };

  function buildSheet(l) {
    const sheet = document.createElement('div');
    sheet.className = 'print-sheet';
    const rooms = [...l.rooms].sort((a, b) => (a.position ?? 0) - (b.position ?? 0));

    for (let i = 0; i < 10; i++) {
      const cell = document.createElement('div');
      cell.className = 'cut-cell';
      const r = rooms[i];
      if (r && r.short_id) {
        cell.appendChild(buildCard(r));
      }
      sheet.appendChild(cell);
    }
    return sheet;
  }

  function buildCard(r) {
    const face = document.createElement('div');
    face.className = 'card-face';
    face.innerHTML = `
      <div class="cf-frame"></div>
      <div class="cf-left">
        <div class="cf-eyebrow">OTAGAISAMA PROJECT</div>
        <div class="cf-project">お 互 い 様 プ ロ ジ ェ ク ト</div>
        <div class="cf-display">届けます<span class="cf-dot">。</span></div>
        <div class="cf-message">このカードには、あなたへの<br>感謝のことばが入っています。<br>QRコードを読み取ってください。</div>
        <div class="cf-tagline">心の価値を、かたちに。</div>
      </div>
      <div class="cf-right">
        <div class="cf-qr">${qrSvg(RECEIVE_BASE + r.short_id)}</div>
        <div class="cf-shortid">${r.short_id}</div>
        <div class="cf-lotno">${r.lot_no || ''}</div>
      </div>`;
    return face;
  }

  // ベクターQR（SVG）：印刷でぼやけない・印刷屋PDFにもそのまま使える
  function qrSvg(text) {
    const qr = qrcode(0, 'M');
    qr.addData(text);
    qr.make();
    return qr.createSvgTag({ cellSize: 2, margin: 0, scalable: true });
  }
</script>
</body>
</html>
